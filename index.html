<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me Encantas</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">

    <!-- PANTALLA DE ENTRADA -->
    <div id="splash-screen">
        <div class="splash-box">
            <h1 class="splash-text">Me Encantas</h1>
            <!-- La imagen que me pasaste debe llamarse boton.png -->
            <img src="boton.png" alt="Entrar" id="enter-btn" onclick="enterSite()">
            <p class="tap-hint">Haz clic en nosotros para entrar</p>
        </div>
    </div>

    <!-- BOTÓN PARA CAMBIAR ESTILO (Flotante) -->
    <button id="theme-toggler" class="theme-btn hidden" onclick="nextTheme()">✨ Cambiar Estilo</button>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="main-content" class="hidden">
        <div class="particle-container" id="particle-container"></div>

        <audio id="bg-music" loop>
            <source src="cancion4.mp3" type="audio/mpeg">
        </audio>
        <button id="music-control" class="music-btn">🎵 Música</button>

        <header class="hero">
            <div class="hero-content fade-in">
                <h1>Hola Adriana</h1>
            </div>
        </header>

        <main class="container">
            <section class="section note-section fade-in">
                <div class="main-note">
                    <p id="phrase">"Tengo la mente nublada últimamente, pero sigo seguro de lo que siento. Gracias por compartir tus días conmigo a diario."</p>
                    <div class="divider" id="theme-icon">✨ Nuestra Conexión ✨</div>
                </div>
            </section>
            
            <section id="galeria" class="section fade-in">
                <h2 class="section-title">Nuestros Momentos</h2>
                <div class="grid-gallery">
                    <!-- Fotos del 1 al 24 -->
                    <div class="gallery-item"><img src="foto1.png" alt="1" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto2.png" alt="2" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto3.png" alt="3" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto4.png" alt="4" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto5.png" alt="5" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto6.png" alt="6" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto7.png" alt="7" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto8.png" alt="8" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto9.png" alt="9" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto10.png" alt="10" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto11.png" alt="11" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto12.png" alt="12" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto13.png" alt="13" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto14.png" alt="14" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto15.png" alt="15" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto16.png" alt="16" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto17.png" alt="17" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto18.png" alt="18" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto19.png" alt="19" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto20.png" alt="20" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto21.png" alt="21" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto22.png" alt="22" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto23.png" alt="23" onclick="openModal(this.src)"></div>
                    <div class="gallery-item"><img src="foto24.png" alt="24" onclick="openModal(this.src)"></div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p id="footer-text">Conectados por siempre &copy; 2026</p>
        </footer>
    </div>

    <div id="modal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="img01">
    </div>

    <script src="script.js"></script>
</body>
</html>
